<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify receipt — Alpha Suite</title><link rel="icon" href="../assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2.css?v=1"></head>
<body><div class="top"><img src="../assets/wolf-crest.png" alt=""><div class="t"><b>ALPHA SUITE</b><small>Receipt verification</small></div></div>
<main id="m"><p class="empty">Checking…</p></main>
<script type="module">
import { sb, esc, peso, fmtDateTime } from './lib.js?v=1';
const m = document.getElementById('m'), code = new URLSearchParams(location.search).get('c');
try {
  if (!code) throw new Error('No receipt code in this link.');
  const { data, error } = await sb.rpc('v2_verify_receipt', { p_code: code });
  if (error) throw error;
  m.innerHTML = data ? `<div class="card"><p><span class="tag ok">Verified</span></p><h2 style="margin:6px 0">${esc(data.receipt_no)}</h2>
    <div class="row"><span>Received from</span><b>${esc(data.payer)}</b></div><div class="row"><span>Amount</span><b>${peso(data.amount)}</b></div>
    <div class="row"><span>For</span><b>${esc(data.purpose || data.category)}</b></div><div class="row"><span>Date</span><b>${fmtDateTime(data.at)}</b></div>
    <div class="row"><span>Status</span><b>${esc(data.status)}</b></div></div>`
    : `<div class="card"><span class="tag bad">Not found</span><p>This receipt does not exist or was voided. Ask the Treasurer.</p></div>`;
} catch (e) { m.innerHTML = `<div class="card"><b>Couldn't check this receipt.</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Retry</button></div>`; }
</script></body></html>
