<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSMT 1-Alpha — Alpha Suite</title><link rel="icon" href="../assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2.css?v=1"></head>
<body>
<div class="top"><img src="../assets/wolf-crest.png" alt=""><div class="t"><b>ALPHA SUITE</b><small>BSMT 1-Alpha · Batch 28 · PIT-COMED</small></div><span class="chip syncing" id="sync"><i></i><span>Connecting</span></span><a class="btn gold sm" href="app.html" style="text-decoration:none">Officer sign in</a></div>
<main id="m"><p class="empty">Loading…</p></main>
<script type="module">
import { sb, db, esc, peso, fmtDate, onSync, watch } from './lib.js?v=1';
onSync((s, d) => { const c = document.getElementById('sync'); c.className = 'chip ' + s; c.querySelector('span').textContent = { live:'Live', syncing:'Syncing…', offline:'Offline', error:'Sync error' }[s]; c.title = d || ''; });
let openPast = null;
async function draw() {
  const [off, tre, stand] = await Promise.all([db(sb.rpc('v2_public_officers')), db(sb.rpc('v2_public_treasury')), db(sb.rpc('v2_public_standing'))]);
  const ents = tre.entries || [];
  const list = id => (ents.filter(e => e.period_id === id).map(e => `<div class="row"><div class="m"><b>${esc(e.payer || '—')}</b><small>${esc(e.category)}${e.purpose ? ' · ' + esc(e.purpose) : ''} · ${fmtDate(e.at)}</small></div><div class="amt ${e.kind==='expense'?'out':'in'}">${e.kind==='expense'?'−':'+'}${peso(e.amount)}</div></div>`).join('')) || '<p class="empty">No entries.</p>';
  document.getElementById('m').innerHTML = `
   <h2 style="margin:4px 0 10px">Class Fund</h2>
   <div class="grid"><div class="stat gold"><small>Current balance</small><b>${peso(tre.balance)}</b></div><div class="stat"><small>Period</small><b style="font-size:1rem">${esc(tre.open?.name || '—')}</b></div></div>
   <div class="card" style="margin-top:12px"><h3 style="font-size:1rem">Current period</h3>${tre.open ? list(tre.open.id) : ''}</div>
   <h3 style="margin:18px 0 8px">Past collection periods</h3>
   ${(tre.past || []).map(p => `<div class="card"><div class="row" style="border:0;cursor:pointer" data-p="${p.id}"><div class="m"><b>${esc(p.name)}</b><small>Closed ${fmtDate(p.closed_at)}</small></div><div style="text-align:right"><div class="amt">${peso(p.closing_balance)}</div><small class="muted">in ${peso(p.collections_total)} · out ${peso(p.expenses_total)}</small></div></div>${openPast === p.id ? list(p.id) : ''}</div>`).join('') || '<p class="empty">None yet.</p>'}
   <h2 style="margin:22px 0 10px">Standing Board</h2><div class="card">${stand.length ? stand.map(s => `<div class="row"><b>${esc(s.name)}</b><span class="tag bad">${s.outstanding} outstanding</span></div>`).join('') : '<p class="empty">Everyone is in good standing.</p>'}</div>
   <h2 style="margin:22px 0 10px">Officers</h2><div class="card">${off.map(o => `<div class="row"><div class="officer"><div class="av">${o.photo ? `<img src="${o.photo}" alt="" style="object-position:${o.x}% ${o.y}%">` : esc(o.name.split(' ').map(w => w[0]).slice(0, 2).join(''))}</div><div><b>${esc(o.name)}</b><br><small class="muted">${esc(o.position)}</small></div></div></div>`).join('')}</div>`;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { openPast = openPast === b.dataset.p ? null : b.dataset.p; draw(); });
}
draw().catch(e => document.getElementById('m').innerHTML = `<div class="card"><b>Couldn't load.</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Retry</button></div>`);
setInterval(() => draw().catch(()=>{}), 60000);
</script></body></html>
