<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA OFFICERS</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body{ min-height:100vh; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; background:var(--paper); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .topbar .brand img{ width:32px; height:32px; object-fit:contain; }
  .topbar .brand b{ font-family:'Cinzel',serif; color:var(--navy-900); font-size:15px; letter-spacing:.8px; }
  .topbar .right{ display:flex; align-items:center; gap:10px; }
  .topbar .who{ font-size:12px; color:var(--ink-soft); }
  .topbar .who b{ color:var(--navy-900); }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:12.5px;
    padding:9px 16px; border-radius:10px; border:1.5px solid transparent;
    cursor:pointer; text-decoration:none; transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-gold{ background:var(--gold); color:var(--navy-950); box-shadow:0 6px 16px rgba(240,180,41,0.35); }
  .btn-gold:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ border-color:var(--gold-dim); color:var(--navy-900); }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); }
  .btn-sm{ padding:6px 10px; font-size:11.5px; border-radius:8px; }
  .btn svg{ width:14px; height:14px; }

  main{ max-width:1080px; margin:0 auto; padding:36px 20px 80px; }

  .hero-head{ text-align:center; margin-bottom:8px; }
  .hero-head .crest{ width:76px; height:76px; margin:0 auto 12px; }
  .hero-head .crest img{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 4px 14px rgba(15,15,74,0.25)); }
  .hero-head h1{ font-family:'Cinzel',serif; color:var(--navy-900); font-size:26px; letter-spacing:2px; margin:0 0 6px; }
  .hero-head .rule{ width:56px; height:2px; margin:10px auto 14px; background:linear-gradient(90deg,transparent,var(--gold-dim),transparent); }
  .hero-head p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 30px; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:20px;
    align-items:start;
  }

  .officer-card{
    background:var(--paper); border:1.5px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 16px 14px; position:relative;
    opacity:0; transform:translateY(14px); animation:cardIn .55s ease forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }

  .officer-card{
    transition:transform .2s ease, box-shadow .2s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .officer-card:hover{ transform:translateY(-3px); box-shadow:0 16px 30px -14px rgba(20,20,50,0.28); }
  }
  .officer-card:active{ transform:translateY(-1px) scale(0.995); }

  /* ---- square photo with live light sweep + bottom gradient ---- */
  .photo-square{
    position:relative; width:100%; aspect-ratio:1/1; border-radius:12px; overflow:hidden;
    margin-bottom:14px;
    background:linear-gradient(160deg,var(--navy-800),var(--navy-950));
  }
  .photo-square img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .photo-square.editable{ cursor:pointer; }
  .photo-square .fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--gold);
  }
  .photo-square .fallback svg{ width:42%; height:42%; }

  /* a soft light sweep passing across the frame — reads as "alive" without
     darkening/muddying the photo underneath the way a multiply shadow would */
  .photo-square .light-sweep{
    position:absolute; inset:-35%; pointer-events:none; mix-blend-mode:screen; opacity:0;
    background:linear-gradient(115deg, transparent 32%, rgba(255,255,255,0.5) 45%, rgba(255,214,102,0.4) 53%, transparent 66%);
    animation:sweepMove 7s ease-in-out infinite;
  }
  @keyframes sweepMove{
    0%{ transform:translate(-45%,-12%); opacity:0; }
    12%{ opacity:.4; }
    50%{ transform:translate(15%,10%); opacity:.15; }
    88%{ opacity:.4; }
    100%{ transform:translate(-45%,-12%); opacity:0; }
  }

  /* static bottom gradient for depth — strengthened so it reads consistently
     on both bright and dark photos */
  .photo-square .photo-gradient{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(6,8,22,0.8) 0%, rgba(6,8,22,0.34) 38%, transparent 66%);
  }

  /* breathing gold rim */
  .photo-square .photo-ring{
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    border:2px solid rgba(240,180,41,0.85);
    animation:ringPulse 3.6s ease-in-out infinite;
  }
  @keyframes ringPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(240,180,41,0); border-color:rgba(240,180,41,0.75); }
    50%{ box-shadow:0 0 16px 2px rgba(240,180,41,0.35); border-color:rgba(255,214,102,1); }
  }

  /* small role badge tucked in the corner of the photo */
  .role-badge{
    position:absolute; bottom:8px; left:8px; width:26px; height:26px; border-radius:50%;
    background:rgba(9,11,26,0.72); border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center; color:var(--gold);
    backdrop-filter:blur(2px);
  }
  .role-badge svg{ width:14px; height:14px; }

  /* upload progress spinner overlay */
  .photo-loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(9,11,26,0.55); color:var(--gold);
  }
  .photo-loading svg{ width:26px; height:26px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .off-name{ font-family:'Cinzel',serif; color:var(--navy-900); font-size:14.5px; margin:0 0 6px; line-height:1.3; text-align:center; }
  .off-role{
    display:block; width:fit-content; margin:0 auto;
    font-size:10.5px; letter-spacing:1.1px; text-transform:uppercase;
    color:var(--gold-dim); background:rgba(240,180,41,0.14); border:1px solid rgba(240,180,41,0.4);
    border-radius:20px; padding:4px 12px;
  }

  /* ---- collapsible credentials ---- */
  .cred-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    background:transparent; border:none; cursor:pointer; margin-top:12px; padding:6px 4px;
    font-family:'Manrope',sans-serif; font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:var(--gold-dim);
  }
  .cred-toggle:hover{ color:var(--navy-900); }
  .cred-toggle .chev{ width:10px; height:10px; transition:transform .3s ease; }
  .officer-card.expanded .cred-toggle .chev{ transform:rotate(180deg); }

  .cred-panel{
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .45s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
  }
  .officer-card.expanded .cred-panel{ max-height:640px; opacity:1; }
  .cred-inner{ padding-top:12px; margin-top:2px; border-top:1px solid var(--line); text-align:left; }
  .cred-label{ font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold-dim); font-weight:800; margin-bottom:6px; }
  .cred-inner p{ font-size:12px; line-height:1.6; color:var(--ink); margin:0; white-space:pre-line; }
  .cred-inner p.empty{ color:var(--ink-soft); font-style:italic; }

  .edit-tools{

    position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:5;
  }
  .icon-btn{
    width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.92); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer;
    transition:transform .15s ease;
  }
  .icon-btn:active{ transform:scale(0.92); }
  .icon-btn svg{ width:14px; height:14px; }
  .icon-btn:hover{ color:var(--navy-900); border-color:var(--gold-dim); }
  .icon-btn.danger:hover{ color:var(--danger); border-color:var(--danger); }
  @media (hover:none) and (pointer:coarse){
    .icon-btn{ width:34px; height:34px; }
    .icon-btn svg{ width:16px; height:16px; }
  }

  .add-tile{
    border:1.6px dashed var(--line); border-radius:var(--radius);
    padding:18px 16px 20px;
    display:flex; flex-direction:column; align-items:center;
    color:var(--ink-soft); cursor:pointer; background:rgba(255,255,255,0.4);
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .add-tile:hover{ border-color:var(--gold-dim); color:var(--navy-900); background:var(--paper); }
  .add-tile .add-square{
    width:100%; aspect-ratio:1/1; border-radius:12px; border:1.6px dashed var(--gold-dim);
    display:flex; align-items:center; justify-content:center; margin-bottom:14px;
  }
  .add-tile .add-square svg{ width:32px; height:32px; color:var(--gold-dim); }
  .add-tile .add-label{ font-size:13px; font-weight:700; }

  @media (max-width:480px){ .cred-panel.expanded{ max-height:900px; } }

  /* ===== Gate (login/setup) ===== */
  .gate-wrap{ display:flex; align-items:center; justify-content:center; min-height:80vh; padding:24px; }
  .gate-card{
    max-width:380px; width:100%; background:var(--paper); border:1px solid var(--line);
    border-radius:20px; padding:32px 28px; text-align:center; box-shadow:var(--shadow);
  }
  .gate-card .crest{ width:64px; height:64px; margin:0 auto 12px; }
  .gate-card .crest img{ width:100%; height:100%; object-fit:contain; }
  .gate-card h1{ font-family:'Cinzel',serif; font-size:20px; letter-spacing:1.5px; margin:4px 0 2px; color:var(--navy-950); }
  .gate-card .tag{ font-size:10.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--gold-dim); font-weight:700; margin-bottom:22px; }
  .field{ text-align:left; margin-bottom:14px; }
  .field label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line);
    font-family:'Manrope',sans-serif; font-size:13.5px; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--royal); outline-offset:1px; border-color:var(--royal); }
  .field textarea{ resize:vertical; min-height:70px; }
  .gate-note{ font-size:11px; color:var(--ink-soft); margin-top:14px; line-height:1.5; }
  .gate-error{ background:var(--danger-bg); color:var(--danger); font-size:12px; border-radius:8px; padding:8px 10px; margin-bottom:14px; }
  .gate-switch{ font-size:12px; color:var(--ink-soft); margin-top:16px; }
  .gate-switch a{ color:var(--royal); font-weight:700; text-decoration:none; cursor:pointer; }
  .btn-block{ width:100%; justify-content:center; padding:11px 16px; font-size:13.5px; }

  /* ===== Modal ===== */
  .modal-back{
    position:fixed; inset:0; background:rgba(10,10,30,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media(min-width:640px){ .modal-back{ align-items:center; } }
  .modal{
    background:var(--paper); width:100%; max-width:460px; border-radius:20px 20px 0 0;
    padding:24px 22px 26px; max-height:88vh; overflow-y:auto;
  }
  @media(min-width:640px){ .modal{ border-radius:20px; } }
  .modal h2{ font-family:'Cinzel',serif; color:var(--navy-950); font-size:18px; margin:0 0 16px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; justify-content:center; }

  .photo-picker{ margin-bottom:18px; }
  .reposition-frame{
    position:relative; width:180px; max-width:100%; aspect-ratio:1/1; margin:0 auto 10px;
    border-radius:14px; overflow:hidden; touch-action:none; cursor:grab;
    background:linear-gradient(160deg,var(--navy-800),var(--navy-950));
    border:2px solid var(--gold);
  }
  .reposition-frame:active{ cursor:grabbing; }
  .reposition-frame img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; user-select:none; }
  .reposition-frame .fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--gold);
  }
  .reposition-frame .fallback svg{ width:44%; height:44%; }
  .reposition-hint{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    font-size:9.5px; letter-spacing:.4px; color:#fff; background:rgba(9,11,26,0.6);
    padding:3px 9px; border-radius:20px; white-space:nowrap; pointer-events:none;
  }
  .photo-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }

  .accounts-list{ margin-top:6px; }
  .acc-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .acc-row:last-child{ border-bottom:none; }
  .acc-main b{ display:block; font-size:13px; color:var(--navy-900); }
  .acc-main span{ font-size:11.5px; color:var(--ink-soft); }
  .acc-actions{ display:flex; gap:6px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--navy-950); color:#fff; padding:10px 18px; border-radius:10px;
    font-size:12.5px; z-index:100; box-shadow:0 10px 24px rgba(0,0,0,0.3);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .empty-state{ text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:13.5px; }

  footer.tag{ text-align:center; margin-top:50px; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:#b8b3a4; }

  /* ===== accessibility: focus-visible ===== */
  .cred-toggle:focus-visible,
  .icon-btn:focus-visible,
  .add-tile:focus-visible,
  .officer-card:focus-visible,
  .reposition-frame:focus-visible,
  .btn:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible{
    outline:2px solid var(--royal); outline-offset:2px;
  }

  /* ===== last-updated caption in edit modal ===== */
  .last-updated{ font-size:11px; color:var(--ink-soft); margin:-6px 0 14px; font-style:italic; }

  /* ===== loading skeleton ===== */
  .skeleton-card{ pointer-events:none; }
  .skeleton-shimmer, .skeleton-line{
    position:relative; overflow:hidden; background:var(--line); border-radius:8px;
  }
  .skeleton-shimmer::after, .skeleton-line::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    animation:shimmer 1.5s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ transform:translateX(-100%); } 100%{ transform:translateX(100%); }
  }

  /* ===== print / export roster ===== */
  @media print{
    .topbar, .add-tile, .edit-tools, .cred-toggle, footer.tag, .modal-back{ display:none !important; }
    body{ background:#fff !important; }
    .hero-head p{ display:none; }
    .grid{ display:block; }
    .officer-card{
      break-inside:avoid; box-shadow:none !important; border:1px solid #ccc !important;
      display:flex; align-items:flex-start; gap:14px; padding:12px 0; margin-bottom:10px;
      transform:none !important;
    }
    .photo-square{ width:70px; height:70px; flex-shrink:0; margin-bottom:0; }
    .off-info{ flex:1; min-width:0; }
    .light-sweep, .photo-ring{ display:none; }
    .off-name, .off-role{ text-align:left; margin:0 0 4px; }
    .cred-panel{ max-height:none !important; opacity:1 !important; overflow:visible; }
    .cred-inner{ border-top:none; padding-top:2px; }
  }

  @media (prefers-reduced-motion: reduce){
    .officer-card, .light-sweep, .photo-ring, .photo-loading svg, .skeleton-shimmer::after, .skeleton-line::after{ animation:none !important; }
    .cred-panel, .cred-toggle .chev, .officer-card{ transition:none !important; }
  }
</style>
</head>

<div class="topbar">
  <a class="brand" href="index.html">
    <img src="assets/wolf-crest.png" alt="">
    <b>ALPHA OFFICERS</b>
  </a>
  <div class="right" id="topbarRight"></div>
</div>

<main id="app"></main>

<div id="toast" class="toast"></div>

<script type="module">
import { createSupabaseSync } from './src/scripts/shared/supabase-client.js';
import { ICONS } from './src/scripts/shared/icons.js';

const SUPABASE_URL = 'https://gxwgkbplscsduscoeoph.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_m3l1Dxhwj6bIse-3UwBB4w_fqZXLuD0';

const state = {
  loading: true,
  officers: [],
  accounts: [],
  session: null,        // {name, role, username, accountId}
  screen: 'public',      // public | gate-login | gate-setup
  modal: null,           // {type, data}
  loginError: '',
  setupError: '',
  expandedIds: new Set(), // officer ids whose credentials panel is open
  loadError: false,
};

function showToastSafe(msg){ showToast(msg); }

const data = createSupabaseSync({
  url: SUPABASE_URL,
  key: SUPABASE_ANON_KEY,
  storageNamespace: 'alpha-officers',
  onSaveError: () => showToastSafe('Sync failed — check your connection and try again'),
});
const { loadShared, saveShared, loadPersonal, savePersonal, subscribeRealtime, startPolling } = data;
const mutateSharedRaw = data.makeMutateShared(state, { officers_roster: 'officers', officers_accounts: 'accounts' });
async function mutateShared(key, mutator){
  const next = await mutateSharedRaw(key, mutator);
  lastSyncedRaw[key] = JSON.stringify(next);
  return next;
}

const SYNC_KEYS = ['officers_roster', 'officers_accounts'];
let lastSyncedRaw = {};

function applyRemoteUpdate(key, value){
  lastSyncedRaw[key] = JSON.stringify(value);
  if(key === 'officers_roster'){ state.officers = value; }
  if(key === 'officers_accounts'){
    state.accounts = value;
    if(state.session){
      const acc = value.find(a => a.id === state.session.accountId);
      if(!acc){
        state.session = null;
        savePersonal('session', null);
        showToast('Your account was removed — please sign in again');
      }
    }
  }
  renderPreserveFocus();
}

// A remote update (e.g. another officer editing at the same time) shouldn't
// yank focus out from under someone actively typing in a modal. If a modal
// with editable fields is open, skip the destructive re-render — the fresh
// data is already in state and will show next time the modal re-renders
// (e.g. on close/save) rather than mid-keystroke.
function renderPreserveFocus(){
  const modalOpen = document.getElementById('modalBack');
  const typing = modalOpen && document.activeElement &&
    ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) &&
    modalOpen.contains(document.activeElement);
  if(typing){ return; }
  render();
}

async function hashPassword(username, password){
  const enc = new TextEncoder();
  const d = enc.encode('alpha-officers::' + String(username).trim().toLowerCase() + '::' + password);
  const digest = await crypto.subtle.digest('SHA-256', d);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject) => {
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('Not an image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not load image'));
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxSize / Math.max(width, height));
        width = Math.max(1, Math.round(width*scale));
        height = Math.max(1, Math.round(height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function roleLabel(role){ return role === 'mayor' ? 'Mayor' : 'P.I.O.'; }

let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

const FALLBACK_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" style="width:100%;height:100%;"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.2c-3.3 0-9.8 1.6-9.8 4.9V21h19.6v-1.9c0-3.3-6.5-4.9-9.8-4.9z"/></svg>`;

function avatarInner(officer){
  if(officer && officer.photo){
    const posX = officer.photoPosX ?? 50;
    const posY = officer.photoPosY ?? 50;
    const alt = officer.name ? `Photo of ${officer.name}` : 'Officer photo';
    return `<img src="${officer.photo}" alt="${escapeHtml(alt)}" style="object-position:${posX}% ${posY}%;">`;
  }
  return `<div class="fallback">${FALLBACK_SVG}</div>`;
}

/* Small badge icons hinting at each role — matched by keyword so any
   position text still gets a sensible icon rather than nothing. */
const ROLE_ICONS = {
  crown: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8zm2 13h14v2H5v-2z"/></svg>`,
  quill: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20l8-16-4-2-8 14 4 4z"/><path d="M4 22l4-6"/></svg>`,
  coin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1.1 3 2.2c0 2.8-6 1.3-6 4.1 0 1.2 1.3 2.2 3 2.2s3-1.1 3-2.5"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>`,
  megaphone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 002 2h1l3 5V6l-3 5H5a2 2 0 00-2 2z"/><path d="M12 8a5 5 0 010 8m3-11a9 9 0 010 14"/></svg>`,
  shield: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>`,
  star: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .9-5.1 4.9 1.3 7-6.2-3.4-6.2 3.4 1.3-7L2 9.4l7-.9z"/></svg>`,
  diamond: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 9-9 9-9-9 9-9z"/></svg>`,
};

function roleIcon(position){
  // strip punctuation/spacing so "P.I.O." and "PIO" both match the same keyword
  const p = String(position || '').toLowerCase().replace(/[^a-z]/g, '');
  if(p.includes('vice')) return ROLE_ICONS.star;
  if(p.includes('mayor')) return ROLE_ICONS.crown;
  if(p.includes('secretary')) return ROLE_ICONS.quill;
  if(p.includes('treasurer')) return ROLE_ICONS.coin;
  if(p.includes('auditor')) return ROLE_ICONS.check;
  if(p.includes('pio') || p.includes('information')) return ROLE_ICONS.megaphone;
  if(p.includes('marshall') || p.includes('marshal')) return ROLE_ICONS.shield;
  return ROLE_ICONS.diamond;
}

// Org-chart order for display, independent of the order officers were
// added in. Unrecognized positions sort after all known ranks but keep
// their relative order (Array.sort is stable).
function roleRank(position){
  const p = String(position || '').toLowerCase().replace(/[^a-z]/g, '');
  if(p.includes('vice')) return 1;
  if(p.includes('mayor')) return 0;
  if(p.includes('secretary')) return 2;
  if(p.includes('treasurer')) return 3;
  if(p.includes('auditor')) return 4;
  if(p.includes('pio') || p.includes('information')) return 5;
  if(p.includes('marshall') || p.includes('marshal')) return 6;
  return 99;
}

/* ============ Rendering ============ */

function render(){
  renderTopbar();
  const app = document.getElementById('app');
  if(state.loadError){
    app.innerHTML = `
      <div class="empty-state">
        <p style="margin-bottom:14px;">Couldn't connect to load the officer directory. Check your connection and try again.</p>
        <button class="btn btn-gold btn-sm" id="retryBootBtn">Retry</button>
      </div>`;
    const retryBtn = document.getElementById('retryBootBtn');
    if(retryBtn) retryBtn.onclick = () => boot();
    return;
  }
  if(state.loading){
    const skeletons = Array.from({length:4}).map(() => `
      <div class="officer-card skeleton-card">
        <div class="photo-square skeleton-shimmer"></div>
        <div class="skeleton-line" style="width:60%;height:14px;margin:0 auto 8px;"></div>
        <div class="skeleton-line" style="width:40%;height:18px;margin:0 auto;"></div>
      </div>`).join('');
    app.innerHTML = `
      <div class="hero-head">
        <div class="crest"><img src="assets/wolf-crest.png" alt="Alpha logo"></div>
        <h1>MEET THE OFFICERS</h1>
        <div class="rule"></div>
      </div>
      <div class="grid">${skeletons}</div>`;
    return;
  }

  if(state.screen === 'gate-login') return renderLogin(app);
  if(state.screen === 'gate-setup') return renderSetup(app);
  renderDirectory(app);
  renderModal();
}

function renderTopbar(){
  const right = document.getElementById('topbarRight');
  const printBtn = `<button class="btn btn-ghost btn-sm" id="printRosterBtn" title="Print or save the roster as PDF">${ICONS.download || ''} Export</button>`;
  if(state.session){
    right.innerHTML = `
      <span class="who">Signed in as <b>${escapeHtml(state.session.name)}</b> · ${roleLabel(state.session.role)}</span>
      ${state.session.role === 'mayor' ? `<button class="btn btn-ghost btn-sm" id="manageAccBtn">${ICONS.users}Accounts</button>` : ''}
      ${printBtn}
      <button class="btn btn-ghost btn-sm" id="signOutBtn">Sign Out</button>
    `;
    const manageBtn = document.getElementById('manageAccBtn');
    if(manageBtn) manageBtn.onclick = () => { state.modal = {type:'accounts'}; render(); };
    document.getElementById('signOutBtn').onclick = () => {
      state.session = null; savePersonal('session', null); state.screen = 'public'; render();
    };
  } else {
    right.innerHTML = `${printBtn}<button class="btn btn-gold btn-sm" id="loginBtn">${ICONS.key}Officer Login</button>`;
    document.getElementById('loginBtn').onclick = () => {
      state.screen = state.accounts.length ? 'gate-login' : 'gate-setup';
      render();
    };
  }
  const printRosterBtn = document.getElementById('printRosterBtn');
  if(printRosterBtn) printRosterBtn.onclick = () => window.print();
}

const CHEVRON_SVG = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
const SPINNER_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 106.4 2.6"/></svg>`;

function renderDirectory(app){
  const editing = !!state.session;
  const sortedOfficers = [...state.officers].sort((a, b) => roleRank(a.position) - roleRank(b.position));
  const cards = sortedOfficers.map(o => {
    const expanded = state.expandedIds.has(o.id);
    return `
    <div class="officer-card ${expanded ? 'expanded' : ''}" data-id="${o.id}">
      ${editing ? `
        <div class="edit-tools">
          <button class="icon-btn" data-edit="${o.id}" title="Edit">${ICONS.pen}</button>
          <button class="icon-btn danger" data-remove="${o.id}" title="Remove">${ICONS.trash}</button>
        </div>` : ''}
      <div class="photo-square ${editing ? 'editable' : ''}" ${editing ? `data-photo-edit="${o.id}" tabindex="0" role="button" aria-label="Change photo for ${escapeHtml(o.name || 'this officer')}"` : ''} title="${editing ? 'Tap to change photo' : ''}">
        ${avatarInner(o)}
        <div class="light-sweep"></div>
        <div class="photo-gradient"></div>
        <div class="photo-ring"></div>
        <div class="role-badge" title="${escapeHtml(o.position || '')}">${roleIcon(o.position)}</div>
      </div>
      <div class="off-info">
        <div class="off-name">${escapeHtml(o.name || 'Full Name')}</div>
        <span class="off-role">${escapeHtml(o.position || 'Officer')}</span>
        <button class="cred-toggle" data-toggle="${o.id}">
          <span>${expanded ? 'Hide Credentials' : 'Leadership Credentials'}</span>
          ${CHEVRON_SVG}
        </button>
        <div class="cred-panel">
          <div class="cred-inner">
            <div class="cred-label">Leadership Credentials</div>
            ${o.credentials ? `<p>${escapeHtml(o.credentials)}</p>` : `<p class="empty">No credentials added yet.</p>`}
          </div>
        </div>
      </div>
    </div>
  `;
  }).join('');

  const addTile = editing ? `
    <div class="add-tile" id="addOfficerTile" tabindex="0" role="button" aria-label="Add officer">
      <div class="add-square">${ICONS.plus}</div>
      <span class="add-label">Add Officer</span>
    </div>` : '';

  app.innerHTML = `
    <div class="hero-head">
      <div class="crest"><img src="assets/wolf-crest.png" alt="Alpha logo"></div>
      <h1>MEET THE OFFICERS</h1>
      <div class="rule"></div>
      <p>${editing ? 'Tap Leadership Credentials to expand, or use the pencil to edit' : 'BSMT 1-Alpha · Batch 28 — tap Leadership Credentials to read more'}</p>
    </div>
    <div class="grid">${cards}${addTile}</div>
    <footer class="tag">Batch 28 &middot; Palompon Institute of Technology</footer>
  `;

  app.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => toggleCredentials(el.dataset.toggle));
  });
  app.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const o = state.officers.find(x => x.id === el.dataset.edit);
      openOfficerModal(o);
    });
  });
  app.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const o = state.officers.find(x => x.id === el.dataset.remove);
      state.modal = {type:'confirm-remove', data:o};
      render();
    });
  });
  app.querySelectorAll('[data-photo-edit]').forEach(el => {
    const activate = () => {
      const o = state.officers.find(x => x.id === el.dataset.photoEdit);
      openOfficerModal(o);
    };
    el.addEventListener('click', activate);
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }
    });
  });
  const addTileEl = document.getElementById('addOfficerTile');
  if(addTileEl){
    addTileEl.onclick = () => openOfficerModal(null);
    addTileEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openOfficerModal(null); }
    });
  }
}

function toggleCredentials(id){
  const card = document.querySelector(`.officer-card[data-id="${CSS.escape(id)}"]`);
  if(!card) return;
  const willExpand = !card.classList.contains('expanded');
  card.classList.toggle('expanded', willExpand);
  const label = card.querySelector('.cred-toggle span');
  if(label) label.textContent = willExpand ? 'Hide Credentials' : 'Leadership Credentials';
  if(willExpand) state.expandedIds.add(id); else state.expandedIds.delete(id);
}

function openOfficerModal(officer){
  state.modal = {
    type:'officer',
    data: officer ? {...officer, photoPosX: officer.photoPosX ?? 50, photoPosY: officer.photoPosY ?? 50}
                  : { id:null, name:'', position:'', credentials:'', photo:'', photoPosX:50, photoPosY:50 }
  };
  render();
}

/* ============ Modal ============ */

function renderModal(){
  const existing = document.getElementById('modalBack');
  if(existing) existing.remove();
  if(!state.modal) return;

  const back = document.createElement('div');
  back.className = 'modal-back';
  back.id = 'modalBack';

  if(state.modal.type === 'officer') back.innerHTML = officerModalHTML(state.modal.data);
  if(state.modal.type === 'confirm-remove') back.innerHTML = confirmRemoveHTML(state.modal.data);
  if(state.modal.type === 'accounts') back.innerHTML = accountsModalHTML();
  if(state.modal.type === 'add-account') back.innerHTML = addAccountHTML();
  if(state.modal.type === 'reset-pass') back.innerHTML = resetPassHTML(state.modal.data);

  back.addEventListener('click', (e) => { if(e.target === back){ state.modal = null; render(); } });
  document.body.appendChild(back);
  wireModal();
}

const POSITION_OPTIONS = ['Mayor','Vice Mayor','Secretary','Treasurer','Auditor','P.I.O.','Marshall'];

function formatUpdatedStamp(iso){
  if(!iso) return '';
  try{
    const dt = new Date(iso);
    return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) +
      ' at ' + dt.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  }catch(e){ return ''; }
}

  const isNew = !d.id;
  const knownMatch = POSITION_OPTIONS.find(opt => opt.toLowerCase() === String(d.position||'').toLowerCase());
  const isOther = !!d.position && !knownMatch;
  return `
  <div class="modal">
    <h2>${isNew ? 'Add Officer' : 'Edit Officer'}</h2>
    <div class="photo-picker">
      <div class="reposition-frame" id="repositionFrame" tabindex="0" role="slider" aria-label="Drag or use arrow keys to reposition photo">
        ${avatarInner(d)}
        ${d.photo ? `<span class="reposition-hint">Drag to reposition</span>` : ''}
      </div>
      <div class="photo-actions">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
          ${ICONS.camera || ''} ${d.photo ? 'Change Photo' : 'Upload Photo'}
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
        </label>
        ${d.photo ? `<button class="btn btn-ghost btn-sm" id="removePhotoBtn" data-armed="0">Remove</button>` : ''}
      </div>
    </div>
    <div class="field"><label>Full Name</label><input id="m_off_name" value="${escapeHtml(d.name)}" placeholder="e.g. Keanu Makipig Tugonon"></div>

      <label>Position</label>
      <select id="m_off_position_select">
        ${POSITION_OPTIONS.map(opt => `<option value="${opt}" ${knownMatch === opt ? 'selected' : ''}>${opt}</option>`).join('')}
        <option value="__other__" ${isOther ? 'selected' : ''}>Other&hellip;</option>

function wireModal(){
  const cancelBtn = document.getElementById('modalCancel');
  if(cancelBtn) cancelBtn.onclick = () => { state.modal = null; render(); };

  // Officer add/edit — photo block (upload, drag-to-reposition, remove)
  wirePhotoBlock();

  const positionSelect = document.getElementById('m_off_position_select');
  const positionOther = document.getElementById('m_off_position_other');
  if(positionSelect && positionOther){
    positionSelect.onchange = () => {
      const isOther = positionSelect.value === '__other__';
      positionOther.style.display = isOther ? 'block' : 'none';
      if(isOther) positionOther.focus();
    };
  }

  const saveBtn = document.getElementById('modalSave');
  if(saveBtn){
    saveBtn.onclick = async () => {
      const name = document.getElementById('m_off_name').value.trim();
      const selectEl = document.getElementById('m_off_position_select');
      const otherEl = document.getElementById('m_off_position_other');
      const position = selectEl.value === '__other__' ? otherEl.value.trim() : selectEl.value;
      const credentials = document.getElementById('m_off_credentials').value.trim();
      if(!name || !position){ showToast('Name and position are required'); return; }
      const d = state.modal.data;
      const isNew = !d.id;
      const photoPosX = d.photoPosX ?? 50;
      const photoPosY = d.photoPosY ?? 50;
      const updatedBy = state.session ? state.session.name : undefined;
      const updatedAt = new Date().toISOString();
      await mutateShared('officers_roster', (list) => {
        if(isNew){
          return [...list, { id:'off_'+Date.now(), name, position, credentials, photo:d.photo||'', photoPosX, photoPosY, updatedBy, updatedAt }];
        }
        return list.map(o => o.id === d.id ? {...o, name, position, credentials, photo:d.photo||'', photoPosX, photoPosY, updatedBy, updatedAt} : o);
      });
      state.modal = null;
      showToast(isNew ? 'Officer added' : 'Officer updated');
      render();
    };
  }

  const confirmRemoveBtn = document.getElementById('modalConfirmRemove');
  if(confirmRemoveBtn){
    confirmRemoveBtn.onclick = async () => {
      const id = state.modal.data.id;
      await mutateShared('officers_roster', (list) => list.filter(o => o.id !== id));
      state.modal = null;
      showToast('Officer removed');
      render();
    };
  }

  // Accounts
  const addAccountBtn = document.getElementById('addAccountBtn');
  if(addAccountBtn) addAccountBtn.onclick = () => { state.modal = {type:'add-account'}; render(); };

  const createAccountBtn = document.getElementById('modalCreateAccount');
  if(createAccountBtn){
    createAccountBtn.onclick = async () => {
      const name = document.getElementById('m_acc_name').value.trim();
      const role = document.getElementById('m_acc_role').value;
      const username = document.getElementById('m_acc_username').value.trim();
      const password = document.getElementById('m_acc_password').value;
      if(!name || !username || !password){ showToast('Please fill in every field'); return; }
      if(password.length < 4){ showToast('Password must be at least 4 characters'); return; }
      if(state.accounts.some(a => a.username.toLowerCase() === username.toLowerCase())){ showToast('That username is taken'); return; }
      const passwordHash = await hashPassword(username, password);
      await mutateShared('officers_accounts', (list) => [...list, {id:'oacc_'+Date.now(), name, username, role, passwordHash}]);
      state.modal = {type:'accounts'};
      showToast('Account created');
      render();
    };
  }

  document.querySelectorAll('[data-reset]').forEach(el => {
    el.onclick = () => {
      const a = state.accounts.find(x => x.id === el.dataset.reset);
      state.modal = {type:'reset-pass', data:a};
      render();
    };
  });
  document.querySelectorAll('[data-delacc]').forEach(el => {
    el.onclick = async () => {
      const id = el.dataset.delacc;
      const target = state.accounts.find(a => a.id === id);
      const mayorCount = state.accounts.filter(a => a.role === 'mayor').length;
      if(target && target.role === 'mayor' && mayorCount <= 1){
        showToast("Can't remove the only Mayor account");
        return;
      }
      await mutateShared('officers_accounts', (list) => list.filter(a => a.id !== id));
      showToast('Account removed');
      render();
    };
  });

  const confirmResetBtn = document.getElementById('modalConfirmReset');
  if(confirmResetBtn){
    confirmResetBtn.onclick = async () => {
      const pw = document.getElementById('m_reset_password').value;
      if(pw.length < 4){ showToast('Password must be at least 4 characters'); return; }
      const target = state.modal.data;
      const passwordHash = await hashPassword(target.username, pw);
      await mutateShared('officers_accounts', (list) => list.map(a => a.id === target.id ? {...a, passwordHash} : a));
      state.modal = {type:'accounts'};
      showToast('Password reset');
      render();
    };
  }
}

/* Wires the photo block (upload / drag-to-reposition / remove) inside the
   officer modal. Split out from wireModal so a photo change can refresh
   just this block via refreshPhotoBlock() without a full modal re-render
   that would wipe whatever the user has typed into the other fields. */
function wirePhotoBlock(){
  const photoInput = document.getElementById('photoInput');
  if(photoInput){
    photoInput.onchange = async () => {
      const file = photoInput.files[0];
      if(!file) return;
      const frame = document.getElementById('repositionFrame');
      if(frame) frame.insertAdjacentHTML('beforeend', `<div class="photo-loading" id="photoLoadingOverlay">${SPINNER_SVG}</div>`);
      try{
        const dataUrl = await resizeImageFile(file, 500);
        state.modal.data.photo = dataUrl;
        state.modal.data.photoPosX = 50;
        state.modal.data.photoPosY = 50;
        refreshPhotoBlock();
      }catch(e){
        showToast('Could not load that image');
        const overlay = document.getElementById('photoLoadingOverlay');
        if(overlay) overlay.remove();
      }
    };
  }

  const removePhotoBtn = document.getElementById('removePhotoBtn');
  if(removePhotoBtn){
    removePhotoBtn.onclick = () => {
      const armed = removePhotoBtn.dataset.armed === '1';
      if(!armed){
        removePhotoBtn.dataset.armed = '1';
        removePhotoBtn.textContent = 'Confirm Remove?';
        removePhotoBtn.style.color = 'var(--danger)';
        removePhotoBtn.style.borderColor = 'var(--danger)';
        clearTimeout(removePhotoBtn._armTimer);
        removePhotoBtn._armTimer = setTimeout(() => {
          if(!document.body.contains(removePhotoBtn)) return;
          removePhotoBtn.dataset.armed = '0';
          removePhotoBtn.textContent = 'Remove';
          removePhotoBtn.style.color = '';
          removePhotoBtn.style.borderColor = '';
        }, 3000);
      } else {
        clearTimeout(removePhotoBtn._armTimer);
        state.modal.data.photo = '';
        state.modal.data.photoPosX = 50;
        state.modal.data.photoPosY = 50;
        refreshPhotoBlock();
      }
    };
  }

  wireRepositionDrag(document.getElementById('repositionFrame'));
}

function refreshPhotoBlock(){
  const d = state.modal.data;
  const pickerRoot = document.querySelector('.photo-picker');
  if(!pickerRoot) return;
  pickerRoot.innerHTML = `
    <div class="reposition-frame" id="repositionFrame" tabindex="0" role="slider" aria-label="Drag or use arrow keys to reposition photo">
      ${avatarInner(d)}
      ${d.photo ? `<span class="reposition-hint">Drag to reposition</span>` : ''}
    </div>
    <div class="photo-actions">
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
        ${ICONS.camera || ''} ${d.photo ? 'Change Photo' : 'Upload Photo'}
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
      </label>
      ${d.photo ? `<button class="btn btn-ghost btn-sm" id="removePhotoBtn" data-armed="0">Remove</button>` : ''}
    </div>
  `;
  wirePhotoBlock();
}

function wireRepositionDrag(frame){
  if(!frame) return;
  let dragging = false;
  let startX = 0, startY = 0, startPosX = 50, startPosY = 50;
  const getImg = () => frame.querySelector('img');

  frame.addEventListener('pointerdown', (e) => {
    if(!getImg()) return;
    dragging = true;
    try{ frame.setPointerCapture(e.pointerId); }catch(err){}
    startX = e.clientX; startY = e.clientY;
    startPosX = state.modal.data.photoPosX ?? 50;
    startPosY = state.modal.data.photoPosY ?? 50;
  });
  frame.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const rect = frame.getBoundingClientRect();
    const dxPct = ((e.clientX - startX) / rect.width) * 100;
    const dyPct = ((e.clientY - startY) / rect.height) * 100;
    const newX = Math.max(0, Math.min(100, startPosX - dxPct));
    const newY = Math.max(0, Math.min(100, startPosY - dyPct));
    state.modal.data.photoPosX = newX;
    state.modal.data.photoPosY = newY;
    const img = getImg();
    if(img) img.style.objectPosition = `${newX}% ${newY}%`;
  });
  const endDrag = () => { dragging = false; };
  frame.addEventListener('pointerup', endDrag);
  frame.addEventListener('pointercancel', endDrag);
  frame.addEventListener('pointerleave', endDrag);

  // Keyboard fallback: arrow keys nudge the crop position in 5% steps.
  frame.addEventListener('keydown', (e) => {
    if(!getImg()) return;
    const step = 5;
    let dx = 0, dy = 0;
    if(e.key === 'ArrowLeft') dx = -step;
    else if(e.key === 'ArrowRight') dx = step;
    else if(e.key === 'ArrowUp') dy = -step;
    else if(e.key === 'ArrowDown') dy = step;
    else return;
    e.preventDefault();
    const curX = state.modal.data.photoPosX ?? 50;
    const curY = state.modal.data.photoPosY ?? 50;
    const newX = Math.max(0, Math.min(100, curX + dx));
    const newY = Math.max(0, Math.min(100, curY + dy));
    state.modal.data.photoPosX = newX;
    state.modal.data.photoPosY = newY;
    const img = getImg();
    if(img) img.style.objectPosition = `${newX}% ${newY}%`;
  });
}

/* ============ Gate: setup / login ============ */

function renderSetup(app){
  app.innerHTML = `
  <div class="gate-wrap">
    <div class="gate-card">
      <div class="crest"><img src="assets/wolf-crest.png" alt="Alpha logo"></div>
      <h1>Set Up Officer Access</h1>
      <div class="tag">First account &middot; Mayor</div>
      ${state.setupError ? `<div class="gate-error">${escapeHtml(state.setupError)}</div>` : ''}
      <div class="field"><label>Full Name</label><input id="su_name" placeholder="Your full name"></div>
      <div class="field"><label>Username</label><input id="su_username" placeholder="e.g. juan.mayor" autocapitalize="off"></div>
      <div class="field"><label>Password</label><input type="password" id="su_password" placeholder="At least 4 characters"></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="su_confirm" placeholder="Re-enter password"></div>
      <button class="btn btn-gold btn-block" id="setupBtn">Create Mayor Account</button>
      <p class="gate-note">Passwords are hashed before they're stored. This is built for lightweight class use, not high-security accounts — don't reuse a sensitive password here.</p>
      <p class="gate-switch"><a id="backToPublic">&larr; Back to directory</a></p>
    </div>
  </div>`;

  document.getElementById('backToPublic').onclick = () => { state.screen = 'public'; state.setupError=''; render(); };
  document.getElementById('setupBtn').onclick = async () => {
    const name = document.getElementById('su_name').value.trim();
    const username = document.getElementById('su_username').value.trim();
    const password = document.getElementById('su_password').value;
    const confirm = document.getElementById('su_confirm').value;
    if(!name || !username || !password){ state.setupError='Please fill in every field.'; render(); return; }
    if(password.length < 4){ state.setupError='Password must be at least 4 characters.'; render(); return; }
    if(password !== confirm){ state.setupError='Passwords do not match.'; render(); return; }
    const passwordHash = await hashPassword(username, password);
    const account = {id:'oacc_'+Date.now(), name, username, role:'mayor', passwordHash};
    await mutateShared('officers_accounts', (list) => [...list, account]);
    state.session = {name, role:'mayor', username, accountId:account.id};
    await savePersonal('session', state.session);
    state.screen = 'public';
    state.setupError = '';
    showToast('Welcome, Mayor ' + name.split(' ')[0] + '!');
    render();
  };
}

function renderLogin(app){
  app.innerHTML = `
  <div class="gate-wrap">
    <div class="gate-card">
      <div class="crest"><img src="assets/wolf-crest.png" alt="Alpha logo"></div>
      <h1>Officer Login</h1>
      <div class="tag">Mayor &amp; P.I.O. Access</div>
      ${state.loginError ? `<div class="gate-error">${escapeHtml(state.loginError)}</div>` : ''}
      <div class="field"><label>Username</label><input id="lg_username" placeholder="Your username" autocapitalize="off"></div>
      <div class="field"><label>Password</label><input type="password" id="lg_password" placeholder="Your password"></div>
      <button class="btn btn-gold btn-block" id="loginSubmit">Sign In</button>
      <p class="gate-note">Forgot your password? Ask your Class Mayor to reset it from Accounts.</p>
      <p class="gate-switch"><a id="backToPublic">&larr; Back to directory</a></p>
    </div>
  </div>`;

  document.getElementById('backToPublic').onclick = () => { state.screen = 'public'; state.loginError=''; render(); };

  const uInput = document.getElementById('lg_username');
  const pInput = document.getElementById('lg_password');
  const submit = async () => {
    const username = uInput.value.trim();
    const password = pInput.value;
    if(!username || !password){ state.loginError='Enter your username and password.'; render(); return; }
    const passwordHash = await hashPassword(username, password);
    const account = state.accounts.find(a => a.username.toLowerCase() === username.toLowerCase() && a.passwordHash === passwordHash);
    if(!account){ state.loginError='Incorrect username or password.'; render(); return; }
    state.session = {name:account.name, role:account.role, username:account.username, accountId:account.id};
    await savePersonal('session', state.session);
    state.screen = 'public';
    state.loginError = '';
    showToast('Welcome back, ' + account.name.split(' ')[0] + '!');
    render();
  };
  document.getElementById('loginSubmit').onclick = submit;
  pInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
}

/* ============ Boot ============ */

async function checkConnectivity(){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    await fetch(SUPABASE_URL + '/rest/v1/', { headers: { apikey: SUPABASE_ANON_KEY }, signal: ctrl.signal });
    clearTimeout(timer);
    return true; // reaching the server at all (even a 4xx) counts as "online"
  }catch(e){
    return false;
  }
}

let liveSyncStarted = false;

async function boot(){
  state.loading = true;
  state.loadError = false;
  render();

  const online = await checkConnectivity();
  if(!online){
    state.loading = false;
    state.loadError = true;
    render();
    return;
  }

  const [officers, accounts, session] = await Promise.all([
    loadShared('officers_roster', []),
    loadShared('officers_accounts', []),
    loadPersonal('session', null),
  ]);
  state.officers = officers || [];
  state.accounts = accounts || [];
  lastSyncedRaw['officers_roster'] = JSON.stringify(state.officers);
  lastSyncedRaw['officers_accounts'] = JSON.stringify(state.accounts);
  if(session && (accounts||[]).some(a => a.id === session.accountId)){
    state.session = session;
  }
  state.loading = false;
  render();

  if(!liveSyncStarted){
    liveSyncStarted = true;
    subscribeRealtime((key, value) => applyRemoteUpdate(key, value));
    startPolling(SYNC_KEYS, {
      getLastRaw: (k) => lastSyncedRaw[k],
      onChange: (key, value) => applyRemoteUpdate(key, value),
      shouldPoll: () => true,
      intervalMs: 20000,
    });
  }
}

boot();
</script>
